<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THW Dashboard - Passwort zuruecksetzen</title>
<link rel="icon" type="image/png" href="/images/favicon_dashboard.png">
{{.PwaHead}}
<link rel="stylesheet" href="/css/auth.css?v={{.AssetVersion}}">
</head>
<body class="auth-page">
<div class="card">
  <div class="logo"><img src="/images/THW.svg" alt="THW-Logo" class="logo-img"></div>
  <h1>Passwort zuruecksetzen</h1>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  {{if .Info}}<div class="info" style="background:#e7f3ff;padding:10px;border-radius:8px;border:1px solid #b6d7ff">{{.Info}}</div>{{end}}
  {{if not .Info}}
  <p class="info">Bitte gib die fuer dein Konto hinterlegte E-Mail-Adresse an. Du erhaelst einen Link zum Zuruecksetzen.</p>
  <form method="post" action="/forgot_password" autocomplete="off">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="email">E-Mail-Adresse</label>
    <input id="email" name="email" type="text" required autofocus>
    <button type="submit">Link anfordern</button>
  </form>
  {{end}}
  <div class="footer"><a href="/login" style="color:#0a3d91;text-decoration:none">Zurueck zum Login</a></div>
</div>
</body>
</html>
