<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THW Dashboard - Neues Passwort</title>
<link rel="icon" type="image/png" href="/images/favicon_dashboard.png">
{{.PwaHead}}
<link rel="stylesheet" href="/css/auth.css?v={{.AssetVersion}}">
</head>
<body class="auth-page">
<div class="card">
  <div class="logo"><img src="/images/THW.svg" alt="THW-Logo" class="logo-img"></div>
  <h1>Neues Passwort</h1>
  {{if .Done}}
    <div class="info" style="background:#e7f7ec;padding:10px;border-radius:8px;border:1px solid #a3d9b1">Passwort wurde erfolgreich zurueckgesetzt.</div>
    <div class="footer"><a href="/login" style="color:#0a3d91;text-decoration:none">Zum Login</a></div>
  {{else}}
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <p class="info">Bitte neues Passwort setzen (mindestens 10 Zeichen).</p>
    <form method="post" action="/reset_password" autocomplete="new-password">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <input type="hidden" name="token" value="{{.Token}}">
      <label for="password">Neues Passwort</label>
      <input id="password" name="password" type="password" required autofocus minlength="10">
      <label for="password2">Wiederholung</label>
      <input id="password2" name="password2" type="password" required minlength="10">
      <button type="submit">Passwort setzen</button>
    </form>
  {{end}}
</div>
</body>
</html>
